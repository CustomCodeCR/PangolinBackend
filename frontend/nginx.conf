map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        # SignalR/WebSocket upgrade is required for live CMS and itinerary updates.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cada ruta conocida tiene un index.html generado durante el build.
    # Las rutas desconocidas no deben devolver Inicio con HTTP 200 (soft 404).
    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
