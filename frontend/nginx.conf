map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # El dominio raiz permanece reservado a Fennec; este contenedor sirve el host www.

    # /home debe ser un alias permanente del inicio.
    # En el host oficial redirigir; en preview/local mantener HTML 200.
    # Evita salir al sitio publico durante los smoke tests de Docker.
    location = /home {
        if ($host = www.logisticacastrofallas.com) {
            return 301 https://www.logisticacastrofallas.com/;
        }
        try_files /home/index.html =404;
    }
    location = /home/ {
        if ($host = www.logisticacastrofallas.com) {
            return 301 https://www.logisticacastrofallas.com/;
        }
        try_files /home/index.html =404;
    }

    server_tokens off;
    client_max_body_size 24m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        # SignalR/WebSocket upgrade is required for live CMS and itinerary updates.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cada noticia usa una ruta legible; servir la SPA de Noticias para cargar su artículo.
    location ~ ^/noticias/[^/]+/?$ {
        try_files /noticias/index.html =404;
    }

    # Cada ruta conocida tiene un index.html generado durante el build.
    # Las rutas desconocidas no deben devolver Inicio con HTTP 200 (soft 404).
    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
