name: Generate GIO variants in review branch only

on:
  push:
    branches: [perf/gio-picture-avif-20261113]
    paths:
      - .github/workflows/gio-review-assets.yml
      - scripts/generate-gio-image-variants.sh
      - frontend/src/components/AssistantBot.vue
      - scripts/test-nuxt-gio-selenium.py

permissions:
  contents: write

jobs:
  generate-review-assets:
    if: github.repository == 'CustomCodeCR/PangolinBackend' && github.ref == 'refs/heads/perf/gio-picture-avif-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/gio-picture-avif-20261113
          persist-credentials: true
      - name: Install variant encoders (isolated runner only)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq webp libavif-bin imagemagick
      - name: Create validated WebP and AVIF copies, preserving original PNGs
        env:
          GIO_IMAGE_REVIEW_ONLY: '1'
        run: bash scripts/generate-gio-image-variants.sh
      - name: Commit only the four new media variants on this review branch
        run: |
          git add -- \
            frontend/public/images/gio-assistant-base.avif \
            frontend/public/images/gio-assistant-base.webp \
            frontend/public/images/gio-assistant-hand.avif \
            frontend/public/images/gio-assistant-hand.webp
          if git diff --cached --quiet; then
            echo "Variants already match; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(gio): add reviewed AVIF/WebP variants; retain PNG originals"
          git push origin HEAD:refs/heads/perf/gio-picture-avif-20261113
