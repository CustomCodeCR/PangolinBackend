name: Dhole quote POST transport - mocked safety checks
on:
  pull_request:
    branches: [main-2]
    paths:
      - 'backend/Services/DholeQuotePostTransport.cs'
      - 'backend/Program.cs'
      - 'tests/DholePostTransportHarness/**'
      - '.github/workflows/dhole-post-transport-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-post-no-real-network:
    name: Default-off quote transport mock (never contacts Dhole)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fake HTTP only; no credentials or remote POST
        run: dotnet run --project tests/DholePostTransportHarness/DholePostTransportHarness.csproj --configuration Release
