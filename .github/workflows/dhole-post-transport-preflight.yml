name: Dhole quote POST transport - mocked safety checks
on:
  pull_request:
    branches: [main-2]
    paths:
      - 'backend/Services/DholeQuotePostTransport.cs'
      - 'backend/Program.cs'
      - 'tests/DholePostTransportHarness/**'
      - 'scripts/dhole-post-transport-fixtures.mjs'
      - 'scripts/dhole-one-shot-ci-fixture.mjs'
      - 'scripts/dhole-lcl-manual-preflight.mjs'
      - 'tools/DholeOneShotQuote/**'
      - 'scripts/dhole-rate-request-preview.mjs'
      - 'scripts/dhole-public-rate-request-preview.mjs'
      - '.github/workflows/dhole-post-transport-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-post-no-real-network:
    name: Default-off quote transport mock (never contacts Dhole)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build five fake external quote contracts (Node, offline only)
        run: node scripts/dhole-post-transport-fixtures.mjs "$RUNNER_TEMP/dhole-flat-fixtures.json"
      - name: Verify fake C# POST with five JS-generated contracts; never contact Dhole
        run: dotnet run --project tests/DholePostTransportHarness/DholePostTransportHarness.csproj --configuration Release -- "$RUNNER_TEMP/dhole-flat-fixtures.json"
      - name: Generate a wholly fictional manual-LCL review (local file only)
        run: node scripts/dhole-one-shot-ci-fixture.mjs "$RUNNER_TEMP/dhole-one-shot-review.json"
      - name: Compile and preview the one-shot CLI with no network
        run: dotnet run --project tools/DholeOneShotQuote/DholeOneShotQuote.csproj --configuration Release -- preview "$RUNNER_TEMP/dhole-one-shot-review.json"
      - name: Prove NO ENVIAR review cannot be sent without a separate approval
        run: |
          if dotnet run --project tools/DholeOneShotQuote/DholeOneShotQuote.csproj --no-build --configuration Release -- send "$RUNNER_TEMP/dhole-one-shot-review.json" "$RUNNER_TEMP/nonexistent-approval.json"; then
            echo "ERROR: One-shot test review unexpectedly sendable"
            exit 1
          fi
          echo "PASS: direct send blocked for the offline review"
