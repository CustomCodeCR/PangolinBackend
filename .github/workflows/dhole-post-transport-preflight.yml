name: Dhole quote POST transport - mocked safety checks
on:
  pull_request:
    branches: [main-2]
    paths:
      - 'backend/Services/DholeQuotePostTransport.cs'
      - 'backend/Program.cs'
      - 'tests/DholePostTransportHarness/**'
      - 'scripts/dhole-post-transport-fixtures.mjs'
      - 'scripts/dhole-rate-request-preview.mjs'
      - 'scripts/dhole-public-rate-request-preview.mjs'
      - '.github/workflows/dhole-post-transport-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-post-no-real-network:
    name: Default-off quote transport mock (never contacts Dhole)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build five fake external quote contracts (Node, offline only)
        run: node scripts/dhole-post-transport-fixtures.mjs "$RUNNER_TEMP/dhole-flat-fixtures.json"
      - name: Verify fake C# POST with five JS-generated contracts; never contact Dhole
        run: dotnet run --project tests/DholePostTransportHarness/DholePostTransportHarness.csproj --configuration Release -- "$RUNNER_TEMP/dhole-flat-fixtures.json"
