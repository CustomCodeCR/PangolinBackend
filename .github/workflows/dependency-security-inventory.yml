name: Dependency security inventory - Nuxt and .NET
on:
  pull_request:
    branches: [main, main-2]
    paths:
      - 'frontend/nuxt/package*.json'
      - 'backend/**/*.csproj'
      - 'backend/**/packages.lock.json'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - '.github/workflows/dependency-security-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nuxt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit locked Nuxt dependency graph (including build dependencies)
        working-directory: frontend/nuxt
        run: npm audit --audit-level=high
      - name: Audit locked Nuxt production dependency graph
        if: success() || failure()
        working-directory: frontend/nuxt
        run: npm audit --omit=dev --audit-level=high
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore backend packages with advisory audit enabled
        run: dotnet restore backend/CastroFallas.MiniQuote.Api.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:WarningsAsErrors=NU1900%3BNU1903%3BNU1904%3BNU1905
      - name: Report direct and transitive vulnerable NuGet packages
        if: success() || failure()
        run: dotnet package list --project backend/CastroFallas.MiniQuote.Api.csproj --vulnerable --include-transitive --no-restore

  # Temporary candidate experiment on this PR; remove after reviewing and
  # committing the npm-generated patch. Never writes to the repository.
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate targeted Vue development lockfile candidate
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev vite@6.4.5
      - name: Generate targeted Nuxt lockfile candidate
        working-directory: frontend/nuxt
        run: |
          npm pkg set 'overrides.readdir-glob.minimatch=11.0.9'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund vue-i18n@11.4.23
      - name: Record generated dependency-only patch for review
        shell: bash
        run: |
          git diff --check
          echo 'PANGOLIN_DEPENDENCY_PATCH_BEGIN'
          git diff -- frontend/package.json frontend/package-lock.json frontend/nuxt/package.json frontend/nuxt/package-lock.json
          echo 'PANGOLIN_DEPENDENCY_PATCH_END'
      - name: Strict audit of Vue candidate
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Strict audit of Nuxt candidate
        working-directory: frontend/nuxt
        run: npm audit --audit-level=moderate
      - name: Build Vue candidate and run frontend regression guards
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node scripts/test-frontend-merge.cjs
      - name: Isolate Nuxt build from sibling Vue dependencies
        shell: bash
        run: |
          test -d frontend/node_modules
          mv frontend/node_modules "$RUNNER_TEMP/pangolin-vue-node-modules"
          test ! -e frontend/node_modules
      - name: Build Nuxt candidate and exercise isolated SSR news
        working-directory: frontend/nuxt
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
          npm run test:ssr-news
