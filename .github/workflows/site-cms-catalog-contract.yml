name: CMS catalog contract - offline
on:
  pull_request:
    branches: [main, main-2]
    paths:
      - 'frontend/src/siteCmsCatalog.ts'
      - 'frontend/src/lib/serviceExtraBenefits.ts'
      - 'frontend/seo/**'
      - 'frontend/scripts/export-cms-catalog.cjs'
      - 'frontend/package*.json'
      - 'backend/Services/SiteCmsEndpoints.cs'
      - 'backend/CastroFallas.MiniQuote.Api.csproj'
      - 'tests/SiteCmsCatalogHarness/**'
      - '.github/workflows/site-cms-catalog-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install frontend build dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export actual generated editor catalog
        run: node frontend/scripts/export-cms-catalog.cjs /tmp/pangolin-cms-inventory.json
      - name: Compare actual backend allowlists
        run: dotnet run --project tests/SiteCmsCatalogHarness/SiteCmsCatalogHarness.csproj -c Release -- /tmp/pangolin-cms-inventory.json
