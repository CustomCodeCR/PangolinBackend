name: Generate static photo variants for review

on:
  push:
    branches: [perf/static-photo-avif-webp-20261113]
    paths:
      - .github/workflows/static-photo-review-assets.yml

permissions:
  contents: write

jobs:
  generate-assets:
    if: github.repository == 'CustomCodeCR/PangolinBackend' && github.ref == 'refs/heads/perf/static-photo-avif-webp-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/static-photo-avif-webp-20261113
          persist-credentials: true
      - name: Install isolated image encoders
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq webp libavif-bin imagemagick
      - name: Create derivatives without changing JPEG originals
        env:
          STATIC_PHOTO_REVIEW_ONLY: '1'
        run: bash scripts/generate-static-photo-variants.sh
      - name: Commit only four new generated files to the review branch
        run: |
          git add -- \
            frontend/public/images/about-operations-enhanced.avif \
            frontend/public/images/about-operations-enhanced.webp \
            frontend/public/images/cover-logistics.avif \
            frontend/public/images/cover-logistics.webp
          if git diff --cached --quiet; then
            echo "All image variants already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(images): add static WebP/AVIF derivatives, keep JPEG originals"
          git push origin HEAD:refs/heads/perf/static-photo-avif-webp-20261113
