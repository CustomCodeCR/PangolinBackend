name: PR138 navigation only regression
on:
  push:
    branches: [feat/seo-geo-service-landings-20261102]
permissions:
  contents: read
jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Production build
        run: npm run build --prefix frontend
      - name: SEO and crosslink rules
        run: npm run seo:check --prefix frontend
      - name: Frontend regression
        run: node frontend/scripts/test-frontend-merge.cjs
      - name: Chrome browser routes smoke
        run: node frontend/scripts/smoke-browser.cjs
