name: PR138 temporary SEO GEO validation
on:
  push:
    branches: [feat/seo-geo-service-landings-20261102]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci --prefix frontend
      - name: Vue and TypeScript production build plus prerendered route HTML
        run: npm run build --prefix frontend
      - name: SEO routes, schema, sitemap and prerender checks
        run: npm run seo:check --prefix frontend
      - name: Frontend integration regression tests
        run: node frontend/scripts/test-frontend-merge.cjs
      - name: Chrome smoke for public service URLs and protected routes
        run: node frontend/scripts/smoke-browser.cjs
