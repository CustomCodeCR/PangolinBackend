name: One-shot frontend npm audit repair (temporary)
on:
  push:
    branches:
      - fix/frontend-npm-audit-20261118
    paths:
      - .github/workflows/frontend-audit-fix-once.yml

permissions:
  contents: write

jobs:
  repair:
    name: Repair pinned frontend lockfile and test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update only frontend lockfile with compatible npm audit fixes
        run: |
          cd frontend
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Verify resulting lockfile and frontend build
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm run seo:check --prefix frontend
          git diff --check
      - name: Commit vetted lockfile repair back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/package.json
          if git diff --cached --quiet; then
            echo "No dependency changes produced" >&2
            exit 1
          fi
          git commit -m "fix(security): refresh frontend lockfile to remediate npm audit"
          git push origin HEAD:fix/frontend-npm-audit-20261118
