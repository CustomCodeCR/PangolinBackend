name: One-shot frontend npm risk scope check (temporary)
on:
  push:
    branches:
      - fix/frontend-npm-audit-20261118
    paths:
      - .github/workflows/frontend-audit-fix-once.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Verify runtime dependency exposure and upstream advisory status
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install current pinned dependencies
        run: npm ci --prefix frontend
      - name: Enforce zero high/critical runtime dependency findings
        run: npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Check that the affected picomatch dependency is not used at runtime
        run: |
          npm ls --prefix frontend --omit=dev picomatch > /tmp/runtime-picomatch.txt || true
          cat /tmp/runtime-picomatch.txt
          if grep -E '^\s*[└├]── picomatch@|picomatch@.*$' /tmp/runtime-picomatch.txt; then
            echo "Unexpected picomatch runtime dependency" >&2
            exit 1
          fi
          echo "picomatch is not included in the production dependency tree"
      - name: Confirm frontend bundle still builds
        run: npm run build --prefix frontend
