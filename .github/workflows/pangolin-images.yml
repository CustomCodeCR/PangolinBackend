name: Pangolin - Build GHCR and Deploy Images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/pangolin-images.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy images to AlmaLinux after publishing them"
        type: boolean
        required: true
        default: false
      image_tag:
        description: "Optional existing GHCR image tag to deploy (rollback)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: pangolin-production-pipeline
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish images on GitHub-hosted runner
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code on GitHub-hosted runner only
        uses: actions/checkout@v4

      - name: Compute immutable commit tag
        id: version
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR for publishing
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Pangolin frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_OFFICIAL_QUOTES_ENABLED=false
          tags: |
            ghcr.io/customcodecr/pangolinbackend/frontend:latest
            ghcr.io/customcodecr/pangolinbackend/frontend:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/CustomCodeCR/PangolinBackend
          cache-from: type=gha,scope=pangolin-frontend
          cache-to: type=gha,mode=max,scope=pangolin-frontend

      - name: Build and publish Pangolin backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          push: true
          tags: |
            ghcr.io/customcodecr/pangolinbackend/backend:latest
            ghcr.io/customcodecr/pangolinbackend/backend:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/CustomCodeCR/PangolinBackend
          cache-from: type=gha,scope=pangolin-backend
          cache-to: type=gha,mode=max,scope=pangolin-backend

      - name: Package Compose configuration only (no application source)
        uses: actions/upload-artifact@v4
        with:
          name: pangolin-compose
          path: deploy/docker-compose.images.yml
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Pull images and deploy on AlmaLinux (no checkout or build)
    needs: publish
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    runs-on: [self-hosted, linux, x64, dhole]
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      PANGOLIN_ENV_FILE: /opt/dhole/pangolin.env
      PANGOLIN_IMAGE_TAG: ${{ (inputs.image_tag != '' && inputs.image_tag) || needs.publish.outputs.image_tag }}
      DHOLE_NETWORK: dhole
    steps:
      - name: Download Docker Compose configuration (not source code)
        uses: actions/download-artifact@v4
        with:
          name: pangolin-compose
          path: ${{ runner.temp }}/pangolin-runtime

      - name: Validate runtime and environment without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "COMPOSE_FILE=$RUNNER_TEMP/pangolin-runtime/docker-compose.images.yml" >> "$GITHUB_ENV"
          test -r "$PANGOLIN_ENV_FILE"
          test -r "$RUNNER_TEMP/pangolin-runtime/docker-compose.images.yml"

          read_var() {
            sed -n "s/^$1=//p" "$PANGOLIN_ENV_FILE" | head -n 1
          }
          pass="$(read_var PANGOLIN_POSTGRES_PASSWORD)"
          otp="$(read_var AUTH_OTP_PEPPER)"
          jwt="$(read_var AUTH_JWT_SIGNING_KEY)"
          if (( ${#pass} < 20 )) || [[ "${pass^^}" == *CAMBIAR* || "${pass^^}" == *REEMPLAZAR* ]]; then
            echo "::error::Set a strong PANGOLIN_POSTGRES_PASSWORD (20+ characters)."
            exit 1
          fi
          if [[ ! "$otp" =~ ^[[:xdigit:]]{64}$ || ! "$jwt" =~ ^[[:xdigit:]]{64}$ || "$otp" == "$jwt" ]]; then
            echo "::error::AUTH_OTP_PEPPER and AUTH_JWT_SIGNING_KEY must be different 64-character hexadecimal secrets."
            exit 1
          fi
          email_mode="$(read_var EMAIL_MODE)"
          if [[ "$email_mode" == "Graph" ]]; then
            for key in GRAPH_TENANT_ID GRAPH_CLIENT_ID GRAPH_CLIENT_SECRET GRAPH_FROM; do
              if [[ -z "$(read_var "$key")" ]]; then
                echo "::error::Missing Microsoft Graph setting: $key"
                exit 1
              fi
            done
          elif [[ "$email_mode" == "Smtp" ]]; then
            for key in SMTP_HOST SMTP_FROM SMTP_USERNAME SMTP_PASSWORD; do
              if [[ -z "$(read_var "$key")" ]]; then
                echo "::error::Missing SMTP setting: $key"
                exit 1
              fi
            done
          else
            echo "::error::EMAIL_MODE must be Graph or Smtp in production."
            exit 1
          fi
          docker version
          docker compose version
          docker network inspect "$DHOLE_NETWORK" >/dev/null
          docker compose --env-file "$PANGOLIN_ENV_FILE" \
            -f "$RUNNER_TEMP/pangolin-runtime/docker-compose.images.yml" \
            -p pangolin-production config --quiet

      - name: Prevent parallel Fennec and Pangolin domain routers
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^PANGOLIN_TRAEFIK_ENABLED="?true"?[[:space:]]*$' "$PANGOLIN_ENV_FILE"; then
            fennec_running="$(docker ps -q --filter label=com.docker.compose.project=dhole --filter label=com.docker.compose.service=website)"
            if [[ -n "$fennec_running" ]]; then
              echo "::error::Stop Fennec website and disable its automatic redeploy before enabling Pangolin Traefik."
              exit 1
            fi
          fi

      - name: Login to GHCR for pulling
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt images (never build on server)
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$PANGOLIN_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production \
            pull postgres redis backend frontend

      - name: Start database and Redis only
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$PANGOLIN_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production \
            up -d --no-build postgres redis

      - name: Create Pangolin database schema on empty first deploy
        shell: bash
        run: |
          set -euo pipefail
          dc() { docker compose --env-file "$PANGOLIN_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production "$@"; }

          # POSTGRES_DB=login creates the dedicated Pangolin DB on an empty named volume.
          # Never reinitialize an existing or partially migrated application database.
          table_count="$(dc exec -T postgres psql -X -q -U pangolin -d login -Atc \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")"
          if [[ "$table_count" == "0" ]]; then
            echo "New isolated Pangolin DB detected; applying both schemas atomically."
            {
              for schema in AuthSchema.sql OfficialQuotesSchema.sql; do
                echo "Loading schema from backend Docker image: $schema" >&2
                docker run --rm --entrypoint cat \
                  "ghcr.io/customcodecr/pangolinbackend/backend:$PANGOLIN_IMAGE_TAG" \
                  "/app/Database/$schema"
              done
            } | dc exec -T postgres psql -X -v ON_ERROR_STOP=1 --single-transaction -U pangolin -d login
          else
            echo "Pangolin database already has tables; no initialization or destructive changes."
            required_count="$(dc exec -T postgres psql -X -q -U pangolin -d login -Atc \
              "SELECT count(*) FROM (VALUES ('public.clientes'), ('public.usuarios'), ('public.otp_challenges'), ('public.auth_sessions'), ('public.cms_news'), ('public.cms_comments'), ('public.itinerarios'), ('public.quote_requests'), ('public.official_quote_requests')) AS t(tab) WHERE to_regclass(t.tab) IS NOT NULL")"
            if [[ "$required_count" != "9" ]]; then
              echo "::error::Database exists but its schema is incomplete. Backup and apply a reviewed migration; refusing to overwrite it."
              exit 1
            fi
          fi

      - name: Deploy backend and frontend using images only
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$PANGOLIN_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production \
            up -d --no-build backend frontend

      - name: Verify Pangolin readiness through localhost
        shell: bash
        run: |
          set -euo pipefail
          local_port="$(grep -m1 '^PANGOLIN_LOCAL_PORT=' "$PANGOLIN_ENV_FILE" | cut -d= -f2- | tr -d '\r' || true)"
          local_port="${local_port:-8180}"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$local_port/api/health/ready" >/dev/null; then
              echo "Pangolin frontend and backend ready at localhost:$local_port."
              docker compose --env-file "$PANGOLIN_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production ps
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file "$PANGOLIN_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production ps
          docker compose --env-file "$PANGOLIN_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production logs --tail 80 backend frontend
          exit 1
