name: Pangolin - Build GHCR and Deploy Images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/pangolin-images.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy images to AlmaLinux after publishing them"
        type: boolean
        required: true
        default: false
      image_tag:
        description: "Optional existing GHCR image tag to deploy (rollback)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: pangolin-production-pipeline
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish images on GitHub-hosted runner
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code on GitHub-hosted runner only
        uses: actions/checkout@v4

      - name: Compute immutable commit tag
        id: version
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR for publishing
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Pangolin frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_OFFICIAL_QUOTES_ENABLED=true
          tags: |
            ghcr.io/customcodecr/pangolinbackend/frontend:latest
            ghcr.io/customcodecr/pangolinbackend/frontend:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/CustomCodeCR/PangolinBackend
          cache-from: type=gha,scope=pangolin-frontend
          cache-to: type=gha,mode=max,scope=pangolin-frontend

      - name: Build and publish Pangolin backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          push: true
          tags: |
            ghcr.io/customcodecr/pangolinbackend/backend:latest
            ghcr.io/customcodecr/pangolinbackend/backend:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/CustomCodeCR/PangolinBackend
          cache-from: type=gha,scope=pangolin-backend
          cache-to: type=gha,mode=max,scope=pangolin-backend

      - name: Package Compose configuration only (no application source)
        uses: actions/upload-artifact@v4
        with:
          name: pangolin-compose
          path: deploy/docker-compose.images.yml
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy images using existing Dhole infrastructure
    needs: publish
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    runs-on: [self-hosted, linux, x64, dhole]
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DHOLE_ENV_FILE: /opt/dhole/.env
      PANGOLIN_IMAGE_TAG: ${{ (inputs.image_tag != '' && inputs.image_tag) || needs.publish.outputs.image_tag }}
      DHOLE_NETWORK: dhole
      # WWW cutover explicitly requested: enable Pangolin router while preserving Fennec apex.
      # Environment override takes precedence over /opt/dhole/.env for Compose interpolation.
      PANGOLIN_TRAEFIK_ENABLED: "true"
    steps:
      - name: Download only Compose configuration (not application source)
        uses: actions/download-artifact@v4
        with:
          name: pangolin-compose
          path: ${{ runner.temp }}/pangolin-runtime

      - name: Check Dhole configuration and Pangolin secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "COMPOSE_FILE=$RUNNER_TEMP/pangolin-runtime/docker-compose.images.yml" >> "$GITHUB_ENV"
          test -r "$DHOLE_ENV_FILE"
          test -r "$RUNNER_TEMP/pangolin-runtime/docker-compose.images.yml"
          read_var() { grep -m1 "^$1=" "$DHOLE_ENV_FILE" | cut -d= -f2- || true; }
          pgpass="$(read_var PANGOLIN_POSTGRES_PASSWORD)"
          otp="$(read_var PANGOLIN_AUTH_OTP_PEPPER)"
          jwt="$(read_var PANGOLIN_AUTH_JWT_SIGNING_KEY)"
          if [[ ! "$pgpass" =~ ^[[:xdigit:]]{48,}$ ]]; then
            echo "::error::PANGOLIN_POSTGRES_PASSWORD must be a freshly generated 48+ character hex secret."
            exit 1
          fi
          if [[ ! "$otp" =~ ^[[:xdigit:]]{64}$ || ! "$jwt" =~ ^[[:xdigit:]]{64}$ || "$otp" == "$jwt" ]]; then
            echo "::error::Pangolin OTP/JWT secrets must be distinct random 64-character hexadecimal values."
            exit 1
          fi
          mode="$(read_var PANGOLIN_EMAIL_MODE)"
          mode="${mode:-Graph}"
          if [[ "$mode" == "Graph" ]]; then
            for key in PANGOLIN_GRAPH_TENANT_ID PANGOLIN_GRAPH_CLIENT_ID PANGOLIN_GRAPH_CLIENT_SECRET PANGOLIN_GRAPH_FROM; do
              if [[ -z "$(read_var "$key")" ]]; then
                echo "::error::Missing required Pangolin Graph variable $key."
                exit 1
              fi
            done
          elif [[ "$mode" == "Smtp" ]]; then
            for key in PANGOLIN_SMTP_HOST PANGOLIN_SMTP_FROM PANGOLIN_SMTP_USERNAME PANGOLIN_SMTP_PASSWORD; do
              if [[ -z "$(read_var "$key")" ]]; then
                echo "::error::Missing required Pangolin SMTP variable $key."
                exit 1
              fi
            done
          else
            echo "::error::PANGOLIN_EMAIL_MODE must be Graph or Smtp."
            exit 1
          fi
          if [[ -n "$(read_var PANGOLIN_S3_ENDPOINT)" ]]; then
            for key in PANGOLIN_S3_ACCESS_KEY PANGOLIN_S3_SECRET_KEY PANGOLIN_S3_BUCKET; do
              if [[ -z "$(read_var "$key")" ]]; then
                echo "::error::Missing MinIO/S3 setting $key."
                exit 1
              fi
            done
          fi
          for key in POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD FENNEC_HOST FENNEC_WWW_HOST FENNEC_PUBLIC_URL; do
            if [[ -z "$(read_var "$key")" ]]; then
              echo "::error::Missing existing Dhole variable $key."
              exit 1
            fi
          done
          docker network inspect "$DHOLE_NETWORK" >/dev/null
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$RUNNER_TEMP/pangolin-runtime/docker-compose.images.yml" -p pangolin-production config --quiet

      - name: Enforce WWW-only cutover without touching Fennec apex
        shell: bash
        run: |
          set -euo pipefail
          # A safety assertion: the Pangolin router must never claim the apex.
          grep -Fq -- 'pangolin-www.rule=Host(' "$COMPOSE_FILE"
          grep -Fq -- 'pangolin-www.priority=1000' "$COMPOSE_FILE"
          if grep -Eq -- 'pangolin.rule=Host\(|redirectregex' "$COMPOSE_FILE"; then
            echo "::error::Pangolin Compose tries to claim or redirect the Fennec apex domain."
            exit 1
          fi
          echo "Pangolin will serve WWW only, with higher priority than the legacy Fennec route."

      - name: Login to GHCR to pull prebuilt images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull precompiled frontend and backend images
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production pull backend frontend
          docker image inspect postgres:16-alpine >/dev/null 2>&1 || docker pull postgres:16-alpine

      - name: Provision isolated pangolin PostgreSQL role and database on Dhole postgres
        shell: bash
        run: |
          set -euo pipefail
          read_var() { grep -m1 "^$1=" "$DHOLE_ENV_FILE" | cut -d= -f2- || true; }
          export PGHOST="$(read_var POSTGRES_HOST)"
          export PGPORT="$(read_var POSTGRES_PORT)"
          export PGUSER="$(read_var POSTGRES_USER)"
          export PGPASSWORD="$(read_var POSTGRES_PASSWORD)"
          export PANGOLIN_DB_PASSWORD="$(read_var PANGOLIN_POSTGRES_PASSWORD)"
          # Only the already running shared Dhole DB is used; no new postgres container persists.
          docker run --rm --network "$DHOLE_NETWORK" \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PANGOLIN_DB_PASSWORD \
            postgres:16-alpine sh -eu -c '
              role_exists="$(psql -X -d postgres -Atqc "SELECT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='\''pangolin'\'')")"
              if [ "$role_exists" = "f" ]; then
                printf "CREATE ROLE pangolin WITH LOGIN PASSWORD '\''%s'\'';\\n" "$PANGOLIN_DB_PASSWORD" \
                  | psql -X -v ON_ERROR_STOP=1 -d postgres >/dev/null
                echo "Pangolin PostgreSQL role created."
              fi
              db_exists="$(psql -X -d postgres -Atqc "SELECT EXISTS(SELECT 1 FROM pg_database WHERE datname='\''pangolin'\'')")"
              if [ "$db_exists" = "f" ]; then
                psql -X -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE pangolin OWNER pangolin" >/dev/null
                echo "Pangolin PostgreSQL database created."
              else
                owner="$(psql -X -d postgres -Atqc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname='\''pangolin'\''")"
                if [ "$owner" != "pangolin" ]; then
                  echo "Existing pangolin database has unexpected owner; refusing to modify."
                  exit 1
                fi
                echo "Pangolin PostgreSQL database already exists; preserving all data."
              fi
              PGPASSWORD="$PANGOLIN_DB_PASSWORD" PGUSER=pangolin psql -X -d pangolin -Atqc "SELECT 1" >/dev/null
            '
          unset PGPASSWORD PANGOLIN_DB_PASSWORD

      - name: Initialize base schema and prepare official quotes catalog
        shell: bash
        run: |
          set -euo pipefail
          read_var() { grep -m1 "^$1=" "$DHOLE_ENV_FILE" | cut -d= -f2- || true; }
          export PGHOST="$(read_var POSTGRES_HOST)"
          export PGPORT="$(read_var POSTGRES_PORT)"
          export PGUSER=pangolin
          export PGPASSWORD="$(read_var PANGOLIN_POSTGRES_PASSWORD)"
          pg_query() {
            docker run --rm --network "$DHOLE_NETWORK" -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD \
              postgres:16-alpine psql -X -d pangolin -Atqc "$1"
          }
          table_count="$(pg_query "SELECT COUNT(*) FROM pg_tables WHERE schemaname = 'public'")"
          if [[ "$table_count" == "0" ]]; then
            echo "Fresh Pangolin database: applying schema from backend image."
            {
              docker run --rm --entrypoint cat "ghcr.io/customcodecr/pangolinbackend/backend:$PANGOLIN_IMAGE_TAG" /app/Database/AuthSchema.sql
            } | docker run --rm -i --network "$DHOLE_NETWORK" \
              -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD \
              postgres:16-alpine psql -X -d pangolin --single-transaction -v ON_ERROR_STOP=1 -f - >/dev/null
          else
            required="$(pg_query "SELECT COUNT(*) FROM (VALUES ('public.clientes'), ('public.usuarios'), ('public.otp_challenges'), ('public.auth_sessions'), ('public.cms_news'), ('public.cms_comments'), ('public.itinerarios'), ('public.quote_requests')) AS t(tab) WHERE to_regclass(t.tab) IS NOT NULL")"
            if [[ "$required" != "8" ]]; then
              echo "::error::Existing Pangolin base schema is incomplete. Stop and perform a reviewed migration."
              exit 1
            fi
            echo "Existing Pangolin base schema verified; official schema will be checked and upgraded additively."
          fi
          # Solo archivos oficiales sin datos DEV; DDL IF NOT EXISTS e INSERT ON CONFLICT.
          # Una sola transacción, con ON_ERROR_STOP: un error impide el despliegue.
          echo "Applying additive official quote tables and verified location catalogs."
          {
            docker run --rm --entrypoint cat "ghcr.io/customcodecr/pangolinbackend/backend:$PANGOLIN_IMAGE_TAG" /app/Database/OfficialQuotesSchema.sql
            docker run --rm --entrypoint cat "ghcr.io/customcodecr/pangolinbackend/backend:$PANGOLIN_IMAGE_TAG" /app/Database/OfficialQuotesVerifiedLocations.sql
            docker run --rm --entrypoint cat "ghcr.io/customcodecr/pangolinbackend/backend:$PANGOLIN_IMAGE_TAG" /app/Database/OfficialQuotesVideoLocations.sql
          } | docker run --rm -i --network "$DHOLE_NETWORK" -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD postgres:16-alpine psql -X -d pangolin --single-transaction -v ON_ERROR_STOP=1 -f - >/dev/null
          # Verificar cada combinación usada por el asistente antes de mostrarlo al cliente.
          ready_roles="$(pg_query "SELECT COUNT(*) FROM (VALUES
            ('seaport','FCL','origin'),('seaport','FCL','destination'),('inland','FCL','pod'),
            ('seaport','LCL','origin'),('seaport','LCL','destination'),('inland','LCL','pod'),
            ('airport','AIR_LCL','origin'),('airport','AIR_LCL','destination'),
            ('inland','FTL','origin'),('inland','FTL','destination'),
            ('inland','LTL','origin'),('inland','LTL','destination')
          ) AS needed(kind, shipment_type, route_role) WHERE EXISTS (
            SELECT 1 FROM public.official_quote_locations loc
            JOIN public.official_quote_location_usage u ON u.location_id=loc.id
            WHERE loc.active AND loc.kind=needed.kind
              AND u.shipment_type=needed.shipment_type AND u.route_role=needed.route_role
          )")"
          if [[ "$ready_roles" != "12" ]]; then
            echo "::error::Official quote location catalog incomplete (ready roles: $ready_roles/12). Refusing to deploy."
            exit 1
          fi
          required_tables="$(pg_query "SELECT COUNT(*) FROM (VALUES
            ('public.official_quote_locations'),('public.official_quote_location_usage'),
            ('public.official_quote_requests'),('public.official_quote_permissions'),
            ('public.official_quote_audit')
          ) AS t(tab) WHERE to_regclass(t.tab) IS NOT NULL")"
          if [[ "$required_tables" != "5" ]]; then
            echo "::error::Missing official quotes tables after migration."
            exit 1
          fi
          echo "Official quote schema and all 12 location roles verified. No development fixtures loaded."
          unset PGPASSWORD

      - name: Deploy backend and frontend (images only)
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production \
            up -d --no-build --no-deps backend frontend

      - name: Check frontend proxy and backend health
        shell: bash
        run: |
          set -euo pipefail
          local_port="$(grep -m1 '^PANGOLIN_LOCAL_PORT=' "$DHOLE_ENV_FILE" | cut -d= -f2- || true)"
          local_port="${local_port:-8180}"
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$local_port/api/health/ready" >/dev/null; then
              echo "Pangolin API and frontend are ready on localhost:$local_port."
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production logs --tail 80 backend frontend
            exit 1
          fi

          host="$(grep -m1 '^FENNEC_WWW_HOST=' "$DHOLE_ENV_FILE" | cut -d= -f2- | tr -d '\r')"
          test -n "$host"
          routed=false
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 -H "Host: $host" http://127.0.0.1/api/health/ready >/dev/null; then
              echo "Pangolin verified through Traefik using Host: $host"
              routed=true
              break
            fi
            sleep 2
          done
          if [[ "$routed" != true ]]; then
            echo "::error::Traefik WWW route did not return Pangolin backend readiness."
            exit 1
          fi
          # Sin cookie, la API protegida debe responder 401/403 (no 404 ni 5xx).
          for protected_path in '/api/quotes/official/locations?kind=seaport&shipmentType=FCL&routeRole=origin' '/api/admin/quotes/official/permissions/me'; do
            quote_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:$local_port$protected_path")"
            if [[ "$quote_http" != "401" && "$quote_http" != "403" ]]; then
              echo "::error::Protected official quotes API unexpected response (HTTP $quote_http)."
              exit 1
            fi
          done
          echo "Official quote and admin routes respond with authentication required."
          # Reproducir un POST real de navegador con TLS terminado en Traefik:
          # Logout sin cookie no revoca sesiones ni envía OTP.
          # Ambas variantes del dominio deben validar su propio Origin y Host.
          root_host="$(grep -m1 '^FENNEC_HOST=' "$DHOLE_ENV_FILE" | cut -d= -f2- | tr -d '\r')"
          test -n "$root_host"
          for public_host in "$host" "$root_host"; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -X POST \
              -H "Host: $public_host" -H "Origin: https://$public_host" \
              "http://127.0.0.1:$local_port/api/auth/logout")"
            if [[ "$status" != "204" ]]; then
              echo "::error::Pangolin rejects valid POST Origin for $public_host (HTTP $status)."
              exit 1
            fi
            echo "Pangolin accepts valid same-host HTTPS Origin: $public_host"
          done
          blocked="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -X POST \
            -H "Host: $host" -H "Origin: https://outside.example" \
            "http://127.0.0.1:$local_port/api/auth/logout")"
          if [[ "$blocked" != "403" ]]; then
            echo "::error::Pangolin must reject cross-site POST Origin (HTTP $blocked)."
            exit 1
          fi
          echo "Cross-site POST Origin correctly rejected."

          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p pangolin-production ps
