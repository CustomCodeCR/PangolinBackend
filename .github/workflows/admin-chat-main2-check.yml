name: Admin team chat experimental checks

on:
  push:
    branches: [main-3]
    paths:
      - "backend/Services/Realtime/AdminChatHub.cs"
      - "backend/Services/Realtime/AdminChatMedia.cs"
      - "backend/Services/Realtime/AdminChatAudio.cs"
      - "frontend/src/composables/useAdminChatCameras.ts"
      - "frontend/src/composables/useChatStickerLibrary.ts"
      - "frontend/src/components/ChatCameraTile.vue"
      - "backend/Program.cs"
      - "frontend/vite.config.ts"
      - "compose.yaml"
      - ".env.example"
      - "frontend/src/components/AdminTeamChat.vue"
      - ".github/workflows/admin-chat-main2-check.yml"
  pull_request:
    branches: [main-3, main-2]
    paths:
      - "backend/Services/Realtime/AdminChatHub.cs"
      - "backend/Services/Realtime/AdminChatMedia.cs"
      - "backend/Services/Realtime/AdminChatAudio.cs"
      - "frontend/src/composables/useAdminChatCameras.ts"
      - "frontend/src/composables/useChatStickerLibrary.ts"
      - "frontend/src/components/ChatCameraTile.vue"
      - "backend/Program.cs"
      - "frontend/vite.config.ts"
      - "compose.yaml"
      - ".env.example"
      - "frontend/src/components/AdminTeamChat.vue"
      - "frontend/src/pages/ContentManager.vue"
      - ".github/workflows/admin-chat-main2-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile frontend and backend, verify chat wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compile Vue frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Compile ASP.NET backend
        run: dotnet build backend/CastroFallas.MiniQuote.Api.csproj --configuration Release
      - name: Check experimental chat safeguards and UX contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const hub = fs.readFileSync('backend/Services/Realtime/AdminChatHub.cs', 'utf8')
          const media = fs.readFileSync('backend/Services/Realtime/AdminChatMedia.cs', 'utf8')
          const program = fs.readFileSync('backend/Program.cs', 'utf8')
          const chat = fs.readFileSync('frontend/src/components/AdminTeamChat.vue', 'utf8')
          const manager = fs.readFileSync('frontend/src/pages/ContentManager.vue', 'utf8')
          function check(value, label) { if (!value) throw new Error(label) }
          check(hub.includes('[Authorize(Policy = "admin")]'), 'Chat hub must be admin-only')
          check(hub.includes('identity.Role != "admin"'), 'Authenticated identity must be checked')
          check(hub.includes('SetDisplayName(string? requested)'), 'Nickname must be validated on server')
          check(hub.includes('NicknameChanged'), 'Nickname broadcast contract missing')
          check(hub.includes('ReplyToMessage'), 'Existing reply method was lost')
          check(hub.includes('MarkSeen'), 'Existing read receipt method was lost')
          check(chat.includes("trapChatWheel") && chat.includes('passive: false'), 'Wheel chaining guard missing')
          check(hub.includes('SetTyping(bool isTyping)') && hub.includes('TypingChanged'), 'Typing events must be authenticated server-side')
          check(hub.includes('TypingSnapshot') && hub.includes('ClearTypingAsync()'), 'Typing snapshot or disconnect cleanup missing')
          check(chat.includes('onDraftInput') && chat.includes("hub.on('TypingChanged'"), 'Client typing lifecycle missing')
          check(chat.includes('typingSweepTimer') && chat.includes('typingIdleTimer'), 'Typing stale or idle cleanup missing')
          check(chat.includes('team-chat__typing-dots') && chat.includes('prefers-reduced-motion'), 'Accessible typing animation missing')
          check(program.includes('AddSingleton<AdminChatMediaStore>()') && program.includes('MapAdminChatMedia()'), 'Private upload routing missing')
          check(media.includes('RequireAuthorization("admin")') && media.includes('X-Chat-Media'), 'Upload auth and same-origin guard missing')
          check(media.includes('MaxTotalBytes') && media.includes('MaxMessageBytes'), 'Memory caps missing')
          check(media.includes('image/jpeg') && media.includes('0xff') && !media.includes('image/svg+xml'), 'Image signature validation missing')
          check(hub.includes('SetAvatarImage') && hub.includes('IsOwned') && hub.includes('AvatarSnapshot'), 'Avatar ownership or replay missing')
          check(hub.includes('SendImage') && hub.includes('ImageUrl'), 'Image messages missing')
          check(chat.includes('uploadImage(') && chat.includes('compressImage('), 'Compressed image client missing')
          check(chat.includes('team-chat__avatar--message') && chat.includes('team-chat__shared-image'), 'Image/avatar display missing')
          check(hub.includes('public async Task ClearMyChat()') && hub.includes('identity.Role != "admin"'), 'Private chat clear must require admin')
          check(hub.includes('public Task ClearChat() => ClearMyChat();'), 'Older clients must not retain global delete capability')
          check(hub.includes('Clients.Group(PersonalGroup(identity.UsuarioId))') &&
                hub.includes('SendAsync("ChatClearedForUser"'), 'Clear event must only target same-user sessions')
          check(hub.includes('ClearedForUser[identity.UsuarioId] = cutoff') &&
                hub.includes('ClearedForUser.GetValueOrDefault(viewerId, DateTimeOffset.MinValue)') &&
                hub.includes('History.Where(message => message.SentAt > cutoff &&'),
                'Reconnect and unblocking must respect per-user clear cutoff')
          check(hub.includes('ChatMutations.WaitAsync()') && hub.includes('var published = message with { SentAt'), 'Clears and new messages must be ordered')
          check(!hub.includes('History.TryDequeue(out _)') || hub.includes('while (History.Count > Limit)'), 'Unbounded global deletion must be absent')
          check(!hub.includes('Seen.Clear()') && !hub.includes('_images.ClearMessageImages()'), 'Personal clearing may not delete shared reads or images')
          check(chat.includes("connection.invoke('ClearMyChat')") && chat.includes('window.confirm('), 'Client must confirm personal clear')
          check(chat.includes("hub.on('ChatClearedForUser'") &&
                chat.includes('clearedThrough.value') &&
                chat.includes('replyTarget.value = null'), 'Client must filter historical messages per user')
          check(!chat.includes('para TODOS los administradores'), 'Confirmation must accurately describe scope')
          check(chat.includes('html.theme-dark .administration-page .team-chat .team-chat__media-preview'), 'Dark-mode image preview missing')
          check(chat.includes('overscroll-behavior: contain'), 'Touch scroll containment missing')
          check(chat.includes('team-chat__reply-action') && chat.includes('team-chat__seen-button'), 'Message actions missing')
          check(chat.includes('team-chat-profile__form'), 'Nickname editor missing')
          check(chat.includes('html.theme-dark .administration-page .team-chat-profile'), 'Dark-mode profile missing')
          check(hub.includes('ToggleReaction') && hub.includes('AllowedReactions') && hub.includes('ReactionChanged'),
            'Server-controlled reactions missing')
          check(hub.includes('ImageViewed') && hub.includes('WasViewed') && hub.includes('SendMedia'),
            'View-once message lifecycle missing')
          check(media.includes('ConsumeOnce') && media.includes('ViewedBy.Add') && media.includes('ReadRegular'),
            'Server-side one-time consumption missing')
          check(media.includes('!item.Published || item.IsViewOnce') &&
                media.includes('IsSameOriginMediaAction(http)'),
            'View-once GET bypass or CSRF guard regression')
          check(chat.includes("hub.on('ReactionChanged'") && chat.includes('toggleReaction('),
            'Client emoji reactions missing')
          check(chat.includes('openSharedImage') && chat.includes('closeViewer') &&
                chat.includes('role="dialog"') && !chat.includes('target="_blank"'),
            'Images must open in an accessible in-chat viewer')
          check(chat.includes('toggleViewOnce') && chat.includes("'/consume'") &&
                chat.includes('OneTimeImageViewed'), 'View-once user experience missing')
          check(chat.includes('image/png') && chat.includes('isSticker') && chat.includes("pickImage('sticker')"),
            'Photo sticker support missing')
          const audio = fs.readFileSync('backend/Services/Realtime/AdminChatAudio.cs', 'utf8')
          const camera = fs.readFileSync('frontend/src/composables/useAdminChatCameras.ts', 'utf8')
          const stickers = fs.readFileSync('frontend/src/composables/useChatStickerLibrary.ts', 'utf8')
          const vite = fs.readFileSync('frontend/vite.config.ts', 'utf8')
          const compose = fs.readFileSync('compose.yaml', 'utf8')
          check(vite.includes('allowedHosts: allowedTailnetHost') &&
                vite.includes('VITE_TAILSCALE_HOST') &&
                !vite.includes('allowedHosts: true,'),
            'Vite must allow only the configured tailnet host')
          check(compose.includes('Security__TailscaleHost:') &&
                compose.includes('VITE_TAILSCALE_HOST:'),
            'Docker must pass the same tailnet host to API and Vite')
          check(program.includes('trustedTailnetOrigin') &&
                program.includes('Security:TailscaleHost') &&
                program.includes('origin.IsDefaultPort') &&
                program.includes('!trustedTailnetOrigin'),
            'API must validate the exact configured HTTPS Tailscale origin')
          check(program.includes('AddSingleton<AdminChatAudioStore>()') && program.includes('MapAdminChatAudio()'),
            'Private audio service must be wired')
          check(audio.includes('RequireAuthorization("admin")') && audio.includes('MaxClipBytes') &&
                audio.includes('X-Chat-Media') && audio.includes('FindPublished'),
            'Audio access limits/auth must be enforced')
          check(hub.includes('SendVoice(') && chat.includes("connection.invoke('SendVoice'"),
            'Voice messages must be routed through hub')
          check(hub.includes('SendCameraSignal') && hub.includes('StartCamera') &&
                hub.includes('StopCamera') && hub.includes('Cameras.Count >= 6'),
            'Camera signaling and participant limits missing')
          check(camera.includes('RTCPeerConnection') && camera.includes('getUserMedia') &&
                camera.includes("iceServers: []") && camera.includes('cleanup'),
            'Peer-to-peer camera logic or cleanup missing')
          check(stickers.includes('indexedDB') && stickers.includes('LIMIT = 32') &&
                chat.includes('saveMessageSticker') && chat.includes('useSavedSticker'),
            'Sticker collection lifecycle missing')
          check(chat.includes('team-chat__emoji-grid') && chat.includes('SmilePlus') &&
                chat.includes('scrollBottom()'), 'Emoji picker or auto-scroll missing')
                    check(manager.includes("section !== 'users' && section !== 'chat'"), 'Chat must not render multimedia form')
          check(hub.includes('"🦞", "🏳️‍🌈"') &&
                chat.includes("'🦞', '🏳️‍🌈'"),
            'Both new reaction emojis must be accepted by backend and frontend')
          check(hub.includes('ReactionNames[identity.UsuarioId]') &&
                hub.includes('new ChatReaction(entry.Key, ids,') &&
                hub.includes('string[] UserNames'),
            'Reaction identities must be validated and broadcast by the server')
          check(chat.includes('showReactionUsers') && chat.includes('reactorNames') &&
                chat.includes('team-chat__reactors'),
            'The reaction count must reveal who reacted on desktop and mobile')
          check(chat.includes("list.value?.addEventListener('wheel', trapChatWheel") &&
                !chat.includes("chatPanel.value?.addEventListener('wheel', trapChatWheel") &&
                chat.includes("list.value?.removeEventListener('wheel', trapChatWheel"),
            'Only the message viewport may trap page scrolling')
          check(chat.includes('@wheel="scrollEmojiTray"') &&
                chat.includes('emojiGrid.value.scrollTop +='),
            'The reaction picker must scroll internally')
          check(chat.includes('@paste="onComposerPaste"') &&
                chat.includes('event.clipboardData?.items') &&
                chat.includes('compressImage(file, 1200, 800_000)'),
            'Paste-to-attach image support is missing')
          check(hub.includes('SetUserBlocked(string? targetUserId, bool blocked)') &&
                hub.includes('identity.Role != "admin"') &&
                hub.includes('targetId == identity.UsuarioId') &&
                hub.includes('!ReactionNames.ContainsKey(targetId)'),
            'Block target and actor must be authenticated and cannot be self')
          check(hub.includes('BlockedByUser') && hub.includes('ChatMutations.WaitAsync()') &&
                hub.includes('MaxBlockedUsers') && hub.includes('LastBlockAction'),
            'Block lists must be bounded, serialized and rate limited')
          check(hub.includes('SendPersonalHistory(Clients.Caller, identity.UsuarioId)') &&
                hub.includes('!IsBlocked(viewerId, message.UserId)') &&
                hub.includes('IsBlocked(viewerId, published.UserId)'),
            'Blocker must not receive blocked message history or new messages')
          check(hub.includes('Clients.Group(PersonalGroup(targetId)).SendAsync("ChatBlockNotice"') &&
                hub.includes('Clients.Group(PersonalGroup(viewerId)).SendAsync("ChatBlockNotice"') &&
                !hub.includes('Clients.All.SendAsync("ChatBlockNotice"'),
            'Block notices must reach only actor and target')
          check(hub.includes('BlockNotices.Remove(identity.UsuarioId)') &&
                hub.includes('SendPersonalHistory(Clients.Group(PersonalGroup(viewerId)), viewerId)'),
            'Personal clear and unblock history restoration missing')
          check(chat.includes("hub.on('BlockedSnapshot'") &&
                chat.includes("hub.on('BlockListChanged'") &&
                chat.includes("hub.on('ChatBlockNotice'") &&
                chat.includes('chatTimeline = computed'),
            'Client must render system notices and hide users on every connected tab')
          check(chat.includes("connection.invoke('SetUserBlocked'") &&
                chat.includes('Bloqueados ({{ blockedUsers.length }})') &&
                chat.includes('team-chat__person-menu') &&
                chat.includes('team-chat__system-message'),
            'Reversible blocked-person management or inline notices missing')
          check(chat.includes('blockedUserIds.value.has(userId)') &&
                chat.includes('visibleMessages.value.filter') &&
                chat.includes('blockedUserIds.value.has(message.userId.toLowerCase())'),
            'Client must hide blocked typing, unread counts and message events')
          console.log('Admin team chat UI and permissions contracts OK')
          NODE
