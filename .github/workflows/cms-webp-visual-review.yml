name: CMS WebP visual preview (isolated)

on:
  pull_request:
    branches: [main-2]
    paths:
      - backend/Services/CmsImageVariants.cs
      - tests/CmsWebpVisualReview/**
      - .github/workflows/cms-webp-visual-review.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate original-vs-WebP comparison using production converter
        env:
          CI: 'true'
          CMS_WEBP_REVIEW_ONLY: '1'
        run: dotnet run --project tests/CmsWebpVisualReview/CmsWebpVisualReview.csproj -c Release
      - name: Publish offline HTML gallery and file-size report for visual review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cms-webp-original-vs-variants
          path: ${{ runner.temp }}/cms-webp-visual-review/
          retention-days: 14
