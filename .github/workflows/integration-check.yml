name: Backend and frontend integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build .NET and Vue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        run: dotnet build backend/CastroFallas.MiniQuote.Api.csproj --configuration Release
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          VITE_OFFICIAL_QUOTES_ENABLED=true npm run build --prefix frontend
      - name: SEO static HTML checks
        run: npm run seo:check --prefix frontend
      - name: Static integration checks
        run: python3 scripts/verify-integration.py
      - name: Official quotes deployment and API contract checks
        run: python3 scripts/verify-official-quotes.py
      - name: Chrome responsive regression for administration (320-1440px)
        run: |
          python3 -m venv /tmp/cf-admin-responsive
          /tmp/cf-admin-responsive/bin/pip install --disable-pip-version-check selenium==4.38.0
          /tmp/cf-admin-responsive/bin/python scripts/test-admin-users-mobile.py
      - name: Attach administration responsive screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-admin-responsive-review
          path: artifacts/admin-users-mobile/
          if-no-files-found: warn
          retention-days: 14

  smoke:
    name: PostgreSQL OTP CRUD CMS smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate local-only development secrets
        run: bash scripts/setup-docker.sh
      # MongoDB is an optional quote-audit store. mongo:8 currently fails on
      # the GitHub-hosted Linux 6.19 kernel, so exercise PostgreSQL/Redis and
      # the backend without requiring MongoDB for this integration smoke.
      - name: Start required test dependencies (PostgreSQL and Redis)
        run: docker compose up -d --wait postgres redis
      - name: Exercise additive CMS news migration three times in isolated PostgreSQL
        run: python3 scripts/test-cms-news-migration.py
      - name: Build backend test container
        run: docker compose build backend
      - name: Start backend without optional MongoDB
        run: docker compose run -d --no-deps --service-ports -e Mongo__ConnectionString= backend dotnet run --project CastroFallas.MiniQuote.Api.csproj --no-launch-profile
      - name: Wait for backend readiness
        run: |
          ready=0
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:5000/api/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Backend did not become ready'
            docker compose logs --tail=80 backend
            exit 1
          fi
      - name: Verify public GIO endpoint with no provider key
        run: python3 scripts/test-gio-public.py
      - name: Test fictitious shipment tracking API
        run: python3 scripts/smoke-tracking-demo.py
      - name: Seed test accounts only
        run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres -d login -f /tmp/SeedLocal.sql
      - name: Install SignalR test client (test containers only)
        run: npm ci --prefix frontend --ignore-scripts
      - name: Test login, SignalR broadcasts, roles, CRUD and quote modes
        env:
          SIGNALR_SMOKE: '1'
        run: python3 scripts/smoke-local.py
      - name: Test real UI login and role-gated pages with Chrome
        run: |
          python3 -m venv /tmp/cf-ui-e2e-venv
          /tmp/cf-ui-e2e-venv/bin/pip install --disable-pip-version-check selenium==4.38.0
          npm run build --prefix frontend
          /tmp/cf-ui-e2e-venv/bin/python scripts/smoke-browser-live.py
      - name: Adjuntar revisión visual de la PR (HTML + capturas de Chrome)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-integration-visual-review
          path: artifacts/visual-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnose Docker startup failures
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --tail=150 mongo postgres redis backend
      - name: Stop containers without deleting volumes
        if: always()
        run: docker compose down
