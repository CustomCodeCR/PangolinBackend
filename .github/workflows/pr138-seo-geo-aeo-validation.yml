name: PR138 SEO GEO AEO integration validation
on:
  push:
    branches: [feat/seo-geo-service-landings-20261102]
permissions:
  contents: read
jobs:
  validate-on-current-main-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate merge into latest main-2 (CI only)
        run: |
          git fetch origin main-2
          git -c user.name=ci -c user.email=ci@example.invalid merge --no-edit origin/main-2
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install from lockfile
        run: npm ci --prefix frontend
      - name: Production Vue TypeScript and prerender build
        run: npm run build --prefix frontend
      - name: SEO GEO AEO content, sitemap, schema and nav-only validation
        run: npm run seo:check --prefix frontend
      - name: Frontend regression
        run: node frontend/scripts/test-frontend-merge.cjs
      - name: Chrome smoke including four public service routes
        run: node frontend/scripts/smoke-browser.cjs
