name: Verificacion de frontend y backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend
      - name: Compilar Vue
        run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compilar API
        run: dotnet build backend/CastroFallas.MiniQuote.Api.csproj --configuration Release

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuracion Compose
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-real
          AUTH_OTP_PEPPER: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: docker compose config --quiet
      - name: Verificar integracion y rutas
        run: python3 scripts/verify-integration.py
