name: Verificacion de frontend y backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend
      - name: Compilar Vue
        run: npm run build
        working-directory: frontend
      - name: Auditar SEO del HTML generado y rutas
        run: npm run seo:check
        working-directory: frontend
      - name: Probar pantallas publicas, login, cotizaciones y administracion con Chrome
        run: node scripts/smoke-browser.cjs
        working-directory: frontend
      - name: Verificar contratos preservados al integrar frontend
        run: node scripts/test-frontend-merge.cjs
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compilar API
        run: dotnet build backend/CastroFallas.MiniQuote.Api.csproj --configuration Release
