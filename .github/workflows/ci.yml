name: Verificacion de frontend y backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend
      - name: Compilar Vue
        run: npm run build
        working-directory: frontend
      - name: Auditar SEO del HTML generado y rutas
        run: npm run seo:check
        working-directory: frontend
      - name: Probar pantallas publicas, login, cotizaciones y administracion con Chrome
        run: node scripts/smoke-browser.cjs
        working-directory: frontend
      - name: Verificar contratos preservados al integrar frontend
        run: node scripts/test-frontend-merge.cjs
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compilar API
        run: dotnet build backend/CastroFallas.MiniQuote.Api.csproj --configuration Release

  nginx-http-seo:
    name: Nginx production routing and SEO HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker frontend and exercise production Nginx
        run: bash scripts/test-nginx-seo.sh

  production-compose:
    name: Production Docker candidate and environment checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate safe CI-only production fixture
        run: |
          cat > .env.production <<'EOF'
          POSTGRES_PASSWORD=ci_fixture_secret_98765432101234567890
          AUTH_OTP_PEPPER=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_JWT_SIGNING_KEY=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          PUBLIC_ORIGIN=https://example.test
          PRODUCTION_HTTP_PORT=8080
          EMAIL_MODE=Smtp
          SMTP_HOST=smtp.example.test
          SMTP_PORT=587
          SMTP_TLS=StartTls
          SMTP_FROM=no-reply@example.test
          SMTP_USERNAME=ci@example.test
          SMTP_PASSWORD=ci-password
          EOF
          chmod 600 .env.production
      - name: Preflight and Docker Compose validation
        run: |
          python3 -m py_compile scripts/preflight-production.py
          python3 scripts/preflight-production.py .env.production
          docker compose --env-file .env.production -f compose.production.yaml config --quiet
      - name: Build production frontend and non-dev backend images
        run: docker compose --env-file .env.production -f compose.production.yaml build frontend backend
