name: Frontend minimatch 11 compatibility probe (CI only)

on:
  pull_request:
    branches: [main-2]
    paths:
      - .github/workflows/frontend-minimatch11-compatibility-probe.yml
      - frontend/package.json
      - frontend/package-lock.json

permissions:
  contents: read

jobs:
  minimatch-v11-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply throwaway override to runner checkout only
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const file = 'package.json'
          const json = JSON.parse(fs.readFileSync(file, 'utf8'))
          if (json.overrides && Object.hasOwn(json.overrides, 'minimatch')) {
            throw new Error('A permanent minimatch override already exists: do not layer probes')
          }
          json.overrides = { ...(json.overrides || {}), minimatch: '11.0.1' }
          fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n')
          console.log('Temporary minimatch@11.0.1 override in disposable CI runner')
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Report dependency tree and require patched minimatch
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ls minimatch --all
          node - <<'NODE'
          const fs = require('node:fs')
          const pkgs = JSON.parse(fs.readFileSync('package-lock.json','utf8')).packages
          const copies = Object.entries(pkgs).filter(([k]) => k === 'node_modules/minimatch' || k.endsWith('/node_modules/minimatch'))
          if (copies.length < 1) throw Error('minimatch not found in probe dependency graph')
          for (const [where, pkg] of copies) {
            if (pkg.version !== '11.0.1') throw Error(where + ' resolved to ' + pkg.version)
          }
          console.log('Patched minimatch 11.0.1 resolved in throwaway dependency tree')
          NODE
      - name: Compile Vue TypeScript and Vite with temporary minimatch
        working-directory: frontend
        run: npm run build
      - name: Run existing real Chrome route and CMS feature smokes
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-browser.cjs
          npm run test:cms-responsive
      - name: Confirm no changes to branch were pushed
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git diff -- frontend/package.json frontend/package-lock.json)"
          echo "CI-only local experiment; package.json and lockfile in PR remain unchanged."
      - name: Save deterministic candidate manifests for separate review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minimatch-11-1-ci-candidate-manifests
          path: |
            frontend/package.json
            frontend/package-lock.json
          if-no-files-found: error
          retention-days: 14
