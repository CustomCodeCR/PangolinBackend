name: CMS WebP .NET codec feasibility (isolated)

on:
  pull_request:
    branches: [main-2]
    paths:
      - .github/workflows/cms-webp-codec-review.yml
      - tests/CmsWebpCodecHarness/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check Linux native library and WebP thumbnails with safe static fixtures
        env:
          CI: 'true'
          CMS_WEBP_REVIEW_ONLY: '1'
        run: dotnet run --project tests/CmsWebpCodecHarness/CmsWebpCodecHarness.csproj -c Release
      - name: Upload temporary preview assets (never deployed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cms-dotnet-webp-feasibility
          path: ${{ runner.temp }}/cms-webp-codec-review/
          retention-days: 7
