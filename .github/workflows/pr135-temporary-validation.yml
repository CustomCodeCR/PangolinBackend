name: PR135 temporary compatibility validation
on:
  push:
    branches: [feat/service-icons-truck-multimodal-20261102]
permissions:
  contents: read
jobs:
  frontend-main2-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recreate merge with the latest main-2 in CI workspace only
        run: |
          git fetch origin main-2
          git -c user.name=compat-check -c user.email=compat-check@example.invalid merge --no-edit origin/main-2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci --prefix frontend
      - name: Build Vue and TypeScript including Lucide Container export
        run: npm run build --prefix frontend
      - name: SEO regression checks
        run: npm run seo:check --prefix frontend
      - name: Frontend integration regression checks
        run: node frontend/scripts/test-frontend-merge.cjs
      - name: Chrome smoke test including /servicios
        run: node frontend/scripts/smoke-browser.cjs
