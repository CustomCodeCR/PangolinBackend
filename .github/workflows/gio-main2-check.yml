name: GIO conversational logistics - main-2
on:
  pull_request:
    branches: [main-2]
    paths:
      - "frontend/src/components/GioOperations.vue"
      - "frontend/src/components/AssistantBot.vue"
      - "frontend/src/services/auth.ts"
      - ".github/workflows/gio-main2-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gio-frontend:
    name: Compile and smoke-test GIO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci --prefix frontend
      - name: Compile TypeScript and Vue into production assets
        run: npm run build --prefix frontend
      - name: Verify preserved frontend integration contracts
        run: node frontend/scripts/test-frontend-merge.cjs
      - name: Run Chrome route smoke checks
        run: node frontend/scripts/smoke-browser.cjs
