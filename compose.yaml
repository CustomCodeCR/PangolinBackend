# DESARROLLO LOCAL COMPARTIDO (NO publicar estos puertos directamente a Internet).
# Cada persona que clone GitHub obtiene su propio volumen postgres_data.
name: castrofallas
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: login
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta el script de configuracion para crear .env}
    ports:
      # DBeaver desde la misma computadora; no disponible en otras computadoras.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/Database/SeedLocal.sql:/tmp/SeedLocal.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d login"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=login;Username=postgres;Password=${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}"
      Auth__OtpPepper: ${AUTH_OTP_PEPPER:?Falta AUTH_OTP_PEPPER}
      Auth__JwtSigningKey: ${AUTH_JWT_SIGNING_KEY:?Falta AUTH_JWT_SIGNING_KEY}
      Auth__SecureCookie: "false"
      Development__ApplySchema: "true"
      Redis__ConnectionString: redis:6379
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: castrofallas_logs
      Ai__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Ai__OpenAI__Model: ${OPENAI_MODEL:-gpt-4.1-mini}
      Email__Mode: ${EMAIL_MODE:-LocalOutbox}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Tls: ${SMTP_TLS:-StartTls}
      Smtp__From: ${SMTP_FROM:-pruebas@castrofallas.local}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "true"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Impide que node_modules de Windows sobreescriba los modulos Linux del contenedor.
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  mongo_data:
