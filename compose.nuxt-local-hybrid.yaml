# Vista hibrida LOCAL de integracion: Nuxt publica + Vue compilada privada.
# El frontend Vite 5173 se mantiene intacto como referencia de desarrollo.
services:
  frontend-legacy-preview:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_OFFICIAL_QUOTES_ENABLED: "true"
    restart: unless-stopped
    depends_on:
      - backend

  nuxt-local-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nuxt-local-hybrid-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NUXT_LOCAL_GATEWAY_BIND_IP:-127.0.0.1}:${NUXT_LOCAL_GATEWAY_PORT:-8083}:80"
    depends_on:
      - frontend-legacy-preview
      - frontend-nuxt
      - backend
