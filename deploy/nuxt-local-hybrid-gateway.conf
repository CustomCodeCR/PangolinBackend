# Gateway exclusivamente local para probar Nuxt SSR y las pantallas Vue
# autenticadas bajo el mismo origen. No usar como configuración de producción.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream local_vue { server frontend:5173; keepalive 12; }
upstream local_nuxt { server frontend-nuxt:3000; keepalive 12; }
upstream local_backend { server backend:5000; keepalive 12; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 24m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Ruta pública exclusiva de Nitro, usada por las noticias SSR.
    location = /api/public-news {
        proxy_pass http://local_nuxt;
        proxy_set_header Host $host;
    }

    # Autenticación, API del CMS y conexiones SignalR permanecen en .NET.
    location ^~ /api/ {
        proxy_pass http://local_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }

    # La migración de estas funciones aún no está aprobada: conservamos Vue.
    location ~ ^/(bienvenidos|administracion|admin|cotizaciones|tracking|itinerario)(/|$) {
        proxy_pass http://local_vue;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Los módulos de desarrollo Vite se solicitan desde /src y /@vite.
    # Sin este proxy, el HTML de Vue cargaría pero las vistas quedarían vacías.
    location ~ ^/(@vite|@id|@fs|src|node_modules)(/|$) {
        proxy_pass http://local_vue;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Solo las páginas públicas se entregan desde Nuxt.
    location / {
        proxy_pass http://local_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
