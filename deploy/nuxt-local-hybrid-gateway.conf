# SOLO DESARROLLO LOCAL. Páginas públicas Nuxt + cliente Vue compilado.
# Nunca reemplazar el gateway productivo con este archivo.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# No usar upstreams con resolución de DNS fija al arrancar.
# Docker Compose puede recrear Nuxt, backend o Vue con otra IP; Nginx debe
# resolver de nuevo sus nombres y recuperarse sin reiniciar el gateway.
server {
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $nuxt_target http://frontend-nuxt:3000;
    set $legacy_target http://frontend-legacy-preview:80;
    set $backend_target http://backend:5000;
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 24m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-store" always;

    # JSON para SSR de noticias servido por Nitro.
    location = /api/public-news {
        proxy_pass $nuxt_target;
        proxy_set_header Host $http_host;
    }

    # Back-end real para autenticación, cotizaciones, CMS y SignalR.
    location ^~ /api/ {
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }

    # La API .NET devuelve las imágenes/videos publicados del CMS bajo
    # /api/content/media/*; /images/* son assets estáticos preparados en Nuxt.
    # Recursos Nuxt y Vue deben mantener sus rutas sin confundir orígenes.
    location ^~ /_nuxt/ {
        proxy_pass $nuxt_target;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
    }

    # Recursos de Vite compilado /assets, NO módulos de desarrollo /src o /@vite.
    # Si se sirvieran desde Nuxt, la SPA puede quedar completamente blanca.
    location ^~ /assets/ {
        proxy_pass $legacy_target;
        proxy_set_header Host $http_host;
    }

    # Rutas privadas existentes: preservamos Vue funcional y el mismo backend.
    location ~ ^/(bienvenidos|administracion|admin|cotizaciones|tracking|itinerario)(/|$) {
        proxy_pass $legacy_target;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Rutas públicas migradas a Nuxt SSR.
    location / {
        proxy_pass $nuxt_target;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
