# SOLO DESARROLLO LOCAL. Páginas públicas Nuxt + cliente Vue compilado.
# Nunca reemplazar el gateway productivo con este archivo.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream local_vue { server frontend-legacy-preview:80; keepalive 12; }
upstream local_nuxt { server frontend-nuxt:3000; keepalive 12; }
upstream local_backend { server backend:5000; keepalive 12; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 24m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-store" always;

    # JSON para SSR de noticias servido por Nitro.
    location = /api/public-news {
        proxy_pass http://local_nuxt;
        proxy_set_header Host $http_host;
    }

    # Back-end real para autenticación, cotizaciones, CMS y SignalR.
    location ^~ /api/ {
        proxy_pass http://local_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }

    # Recursos de Vite compilado /assets, NO módulos de desarrollo /src o /@vite.
    # Si se sirvieran desde Nuxt, la SPA puede quedar completamente blanca.
    location ^~ /assets/ {
        proxy_pass http://local_vue;
        proxy_set_header Host $http_host;
    }

    # Rutas privadas existentes: preservamos Vue funcional y el mismo backend.
    location ~ ^/(bienvenidos|administracion|admin|cotizaciones|tracking|itinerario)(/|$) {
        proxy_pass http://local_vue;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Rutas públicas migradas a Nuxt SSR.
    location / {
        proxy_pass http://local_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
