# Pangolin production: SOLO imagenes construidas por GitHub Actions.
# Despliegue GHCR: backend + frontend sobre /opt/dhole/.env; crea base pangolin en postgres existente.
# Inicio seguro: traefik.enable=false mantiene Fennec sin cambios hasta el corte planificado.
# Reutiliza PostgreSQL, Redis, MinIO (opcional) y Traefik de Dhole.
# Requiere /opt/dhole/.env como entorno. NUNCA usar `build:` en AlmaLinux.
name: pangolin-production

services:
  backend:
    image: ghcr.io/customcodecr/pangolinbackend/backend:${PANGOLIN_IMAGE_TAG:?Definir PANGOLIN_IMAGE_TAG}
    restart: unless-stopped
    environment:
      TZ: "${TZ:-America/Costa_Rica}"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      Development__ApplySchema: "false"
      Features__OfficialQuotesEnabled: "false"
      ConnectionStrings__Postgres: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=pangolin;Username=pangolin;Password=${PANGOLIN_POSTGRES_PASSWORD:?Definir PANGOLIN_POSTGRES_PASSWORD}"
      Auth__OtpPepper: "${PANGOLIN_AUTH_OTP_PEPPER:?Definir PANGOLIN_AUTH_OTP_PEPPER}"
      Auth__JwtSigningKey: "${PANGOLIN_AUTH_JWT_SIGNING_KEY:?Definir PANGOLIN_AUTH_JWT_SIGNING_KEY}"
      Auth__SecureCookie: "true"
      Security__PublicOrigin: "https://${FENNEC_WWW_HOST:?Definir FENNEC_WWW_HOST}"
      # Optional verified proxy hops for public-read and auth quotas.
      # Empty by default: do not trust X-Forwarded-For until the real production
      # chain and stable proxy identities are confirmed. Never use a Docker subnet.
      RateLimiting__TrustedProxyIps__0: "${PANGOLIN_RATE_LIMIT_TRUSTED_PROXY_IP_0:-}"
      RateLimiting__TrustedProxyIps__1: "${PANGOLIN_RATE_LIMIT_TRUSTED_PROXY_IP_1:-}"
      Email__Mode: "${PANGOLIN_EMAIL_MODE:-Graph}"
      Graph__TenantId: "${PANGOLIN_GRAPH_TENANT_ID:-}"
      Graph__ClientId: "${PANGOLIN_GRAPH_CLIENT_ID:-}"
      Graph__ClientSecret: "${PANGOLIN_GRAPH_CLIENT_SECRET:-}"
      Graph__From: "${PANGOLIN_GRAPH_FROM:-}"
      Smtp__Host: "${PANGOLIN_SMTP_HOST:-}"
      Smtp__Port: "${PANGOLIN_SMTP_PORT:-587}"
      Smtp__Tls: "${PANGOLIN_SMTP_TLS:-StartTls}"
      Smtp__From: "${PANGOLIN_SMTP_FROM:-}"
      Smtp__Username: "${PANGOLIN_SMTP_USERNAME:-}"
      Smtp__Password: "${PANGOLIN_SMTP_PASSWORD:-}"
      Redis__ConnectionString: "${REDIS_CONNECTION_STRING:-redis:6379}"
      Mongo__ConnectionString: "${MONGO_CONNECTION_STRING:-}"
      Mongo__Database: pangolin_logs
      Ai__Groq__ApiKey: "${PANGOLIN_GROQ_API_KEY:-}"
      Ai__Groq__Model: "${PANGOLIN_GROQ_MODEL:-openai/gpt-oss-20b}"
      Instagram__AccessToken: "${PANGOLIN_INSTAGRAM_ACCESS_TOKEN:-}"
      Storage__Endpoint: "${PANGOLIN_S3_ENDPOINT:-}"
      Storage__AccessKey: "${PANGOLIN_S3_ACCESS_KEY:-}"
      Storage__SecretKey: "${PANGOLIN_S3_SECRET_KEY:-}"
      Storage__Bucket: "${PANGOLIN_S3_BUCKET:-castrofallas-media}"
    networks:
      - pangolin-internal
      - dhole

  frontend:
    image: ghcr.io/customcodecr/pangolinbackend/frontend:${PANGOLIN_IMAGE_TAG:?Definir PANGOLIN_IMAGE_TAG}
    restart: unless-stopped
    networks:
      - pangolin-internal
      - dhole
    ports:
      - "127.0.0.1:${PANGOLIN_LOCAL_PORT:-8180}:80"
    depends_on:
      - backend
    labels:
      - "traefik.enable=${PANGOLIN_TRAEFIK_ENABLED:-false}"
      - "traefik.docker.network=${DHOLE_NETWORK:-dhole}"
      # Publicar SOLO www para Pangolin. El dominio raiz sigue con Fennec.
      # Fennec tiene una regla Host(root) || Host(www). Priorizamos Pangolin en www.
      - "traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin-www.rule=Host(`${FENNEC_WWW_HOST:?Definir FENNEC_WWW_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin-www.entrypoints=web"
      - "traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin-www.priority=1000"
      - "traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin-www.service=${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin"
      - "traefik.http.services.${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin.loadbalancer.server.port=80"


  # Nuxt SSR sirve páginas públicas y comparte backend/API internos.
  frontend-nuxt:
    image: ghcr.io/customcodecr/pangolinbackend/nuxt:${PANGOLIN_IMAGE_TAG:?Definir PANGOLIN_IMAGE_TAG}
    restart: unless-stopped
    environment:
      NUXT_CMS_API_BASE: "http://backend:5000"
      NUXT_PUBLIC_SITE_URL: "https://${FENNEC_WWW_HOST:?Definir FENNEC_WWW_HOST}"
    networks:
      - pangolin-internal
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${PANGOLIN_NUXT_LOCAL_PORT:-8182}:3000"

  # Gateway híbrido: Nuxt público, SPA legacy para sesión/cotizaciones/tracking.
  # Activación independiente después de pasar la validación interna.
  seo-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - "${PANGOLIN_GATEWAY_CONFIG_PATH:-/opt/dhole/pangolin-release/nuxt-hybrid-gateway.conf}:/etc/nginx/conf.d/default.conf:ro"
    networks:
      - pangolin-internal
      - dhole
    ports:
      - "127.0.0.1:${PANGOLIN_HYBRID_LOCAL_PORT:-8183}:80"
    depends_on:
      - frontend
      - frontend-nuxt
    labels:
      - "traefik.enable=${PANGOLIN_NUXT_TRAEFIK_ENABLED:-false}"
      - "traefik.docker.network=${DHOLE_NETWORK:-dhole}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin-nuxt-www.rule=Host(`${FENNEC_WWW_HOST:?Definir FENNEC_WWW_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin-nuxt-www.entrypoints=web"
      - "traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin-nuxt-www.priority=1100"
      - "traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin-nuxt-www.service=${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin-nuxt"
      - "traefik.http.services.${TRAEFIK_ROUTER_PREFIX:-prod}-pangolin-nuxt.loadbalancer.server.port=80"

networks:
  pangolin-internal: {}
  dhole:
    external: true
    name: ${DHOLE_NETWORK:-dhole}
