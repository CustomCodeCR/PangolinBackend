map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream pangolin_legacy { server frontend:80; keepalive 12; }
upstream pangolin_nuxt { server frontend-nuxt:3000; keepalive 12; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 24m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Las rutas con sesión, administración y cotizador siguen en el frontend
    # original y mantienen sus cookies, SignalR y autorización del backend.
    location ~ ^/(administracion|admin|cotizaciones|tracking|itinerario|bienvenidos)(/|$) {
        proxy_pass http://pangolin_legacy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Las páginas legales migradas tienen HTML SSR en Nuxt.
    # El router legacy sigue reservado para las pantallas autenticadas.

    # Nuxt sirve sus propios recursos SSR públicos.
    location = /api/public-news {
        proxy_pass http://pangolin_nuxt;
        proxy_set_header Host $host;
    }

    location ^~ /api/ {
        proxy_pass http://pangolin_legacy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://pangolin_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
